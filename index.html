<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.3s ease;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            width: 60px;
            height: 60px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            margin: 0 auto 20px;
        }
        h2 { margin-bottom: 25px; color: #2d3748; font-size: 24px; }
        .input-group {
            margin-bottom: 18px;
            text-align: right;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #4a5568;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }
        button {
            width: 100%;
            padding: 13px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        button:hover { background-color: #5a67d8; }
        button:disabled { background-color: #a0aec0; cursor: not-allowed; }
        
        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid #ffffff;
            border-top: 3px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #status-message {
            margin-top: 18px;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
    <!-- مكتبة EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("dfHcVtsHMU2GkEVfL");
        })();
    </script>
</head>
<body>

    <div class="login-card">
        <div class="logo">🔒</div>
        <h2>تسجيل الدخول</h2>
        <form id="login-form">
            <div class="input-group">
                <label for="user-email">البريد الإلكتروني</label>
                <input type="email" id="user-email" placeholder="example@mail.com" required>
            </div>
            <div class="input-group">
                <label for="user-password">كلمة المرور</label>
                <input type="password" id="user-password" placeholder="••••••••" minlength="6" required>
            </div>
            <button type="submit" id="submit-btn">
                <span class="spinner" id="btn-spinner"></span>
                <span id="btn-text">دخول</span>
            </button>
        </form>
        <div id="status-message"></div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const statusMsg = document.getElementById('status-message');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const userEmail = document.getElementById('user-email').value;

            btnText.textContent = 'جاري التحقق...';
            btnSpinner.style.display = 'inline-block';
            submitBtn.disabled = true;
            statusMsg.textContent = '';

            const templateParams = {
                to_email: userEmail
            };

            emailjs.send('service_jyuwmvb', 'template_qsgvasi', templateParams)
                .then(function(response) {
                    statusMsg.style.color = '#38a169';
                    statusMsg.textContent = 'تم الإرسال بنجاح! جاري توجيهك...';
                    
                    // حفظ حالة الدخول البسيطة
                    localStorage.setItem('isLoggedIn', 'true');

                    setTimeout(function() {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                }, function(error) {
                    statusMsg.style.color = '#e53e3e';
                    statusMsg.textContent = 'حدث خطأ في الإرسال، حاول مجدداً.';
                    btnText.textContent = 'دخول';
                    btnSpinner.style.display = 'none';
                    submitBtn.disabled = false;
                });
        });
    </script>

</body>
  </html>
