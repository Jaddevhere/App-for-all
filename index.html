<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - رمز التحقق</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; transition: all 0.3s; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; padding: 35px 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #2d3748; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; color: #4a5568; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 16px; outline: none; }
        input:focus { border-color: #667eea; }
        button { width: 100%; padding: 12px; background: #667eea; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:disabled { background: #a0aec0; cursor: not-allowed; }
        .resend-btn { background: transparent; color: #667eea; border: 1px solid #667eea; margin-top: 10px; }
        .resend-btn:disabled { color: #a0aec0; border-color: #a0aec0; }
        #status { margin-top: 15px; font-size: 14px; font-weight: 600; }
        #otp-section { display: none; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        (function() { emailjs.init("dfHcVtsHMU2GkEVfL"); })();
    </script>
</head>
<body>

    <div class="card">
        <!-- نموذج البريد وكلمة المرور -->
        <form id="login-form">
            <h2>تسجيل الدخول</h2>
            <div class="input-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="user-email" required placeholder="example@mail.com">
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="user-pass" minlength="6" required placeholder="••••••••">
            </div>
            <button type="submit" id="send-otp-btn">إرسال رمز التحقق</button>
        </form>

        <!-- نموذج إدخال رمز التحقق (OTP) -->
        <div id="otp-section">
            <h2>تأكيد الرمز</h2>
            <p style="font-size:13px; color:#718096;">تم إرسال كود مكون من 6 أرقام إلى بريدك الإلكتروني.</p>
            <div class="input-group">
                <input type="text" id="otp-input" placeholder="أدخل الرمز هنا" maxlength="6" style="text-align:center; letter-spacing: 5px; font-size: 20px;">
            </div>
            <button id="verify-btn" onclick="verifyOTP()">تأكيد الدخول</button>
            <button id="resend-btn" class="resend-btn" onclick="sendOTP()" disabled>إعادة إرسال (60s)</button>
        </div>

        <div id="status"></div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const otpSection = document.getElementById('otp-section');
        const statusMsg = document.getElementById('status');
        const resendBtn = document.getElementById('resend-btn');
        let timerInterval;

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            sendOTP();
        });

        function generateOTP() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        function sendOTP() {
            const email = document.getElementById('user-email').value;
            const generatedOTP = generateOTP();
            const expiresAt = Date.now() + (15 * 60 * 1000); // صلاحية الرمز 15 دقيقة

            statusMsg.style.color = '#333';
            statusMsg.textContent = 'جاري إرسال الرمز...';

            emailjs.send('service_jyuwmvb', 'template_qsgvasi', {
                to_email: email,
                otp_code: generatedOTP
            }).then(() => {
                localStorage.setItem('temp_otp', generatedOTP);
                localStorage.setItem('otp_expires', expiresAt);
                localStorage.setItem('user_email', email);

                loginForm.style.display = 'none';
                otpSection.style.display = 'block';
                statusMsg.style.color = 'green';
                statusMsg.textContent = 'تم إرسال الرمز إلى بريدك!';

                startResendTimer(60);
            }, (err) => {
                statusMsg.style.color = 'red';
                statusMsg.textContent = 'خطأ في الإرسال، حاول مجدداً.';
            });
        }

        function verifyOTP() {
            const userEnteredOTP = document.getElementById('otp-input').value.trim();
            const savedOTP = localStorage.getItem('temp_otp');
            const expiresAt = parseInt(localStorage.getItem('otp_expires'));

            if (Date.now() > expiresAt) {
                statusMsg.style.color = 'red';
                statusMsg.textContent = 'انتهت صلاحية الرمز (15 دقيقة). اطلب رمزاً جديداً.';
                return;
            }

            if (userEnteredOTP === savedOTP) {
                statusMsg.style.color = 'green';
                statusMsg.textContent = 'تم التحقق بنجاح! جاري التوجيه...';

                localStorage.setItem('isLoggedIn', 'true');
                localStorage.removeItem('temp_otp');
                localStorage.removeItem('otp_expires');

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                statusMsg.style.color = 'red';
                statusMsg.textContent = 'الرمز غير صحيح، حاول مرة أخرى.';
            }
        }

        function startResendTimer(seconds) {
            resendBtn.disabled = true;
            let timeLeft = seconds;

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                resendBtn.textContent = `إعادة إرسال (${timeLeft}s)`;
                timeLeft--;

                if (timeLeft < 0) {
                    clearInterval(timerInterval);
                    resendBtn.disabled = false;
                    resendBtn.textContent = 'إعادة إرسال الرمز';
                }
            }, 1000);
        }
    </script>
</body>
</html>
