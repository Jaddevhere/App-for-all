<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRL CLOUD HUB - Auth</title>
    <style>
        :root[data-theme="dark"] {
            --bg: #090d16;
            --card-bg: rgba(17, 24, 39, 0.8);
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --border: rgba(255, 255, 255, 0.1);
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --input-bg: rgba(15, 23, 42, 0.7);
        }
        :root[data-theme="light"] {
            --bg: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: rgba(0, 0, 0, 0.1);
            --accent: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.25);
            --input-bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; transition: background 0.3s, color 0.3s, border-color 0.3s; }
        body { background: var(--bg); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; overflow-x: hidden; color: var(--text-main); }
        
        /* Animated Background Particles Effect */
        .bg-glow {
            position: fixed; width: 350px; height: 350px; border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            animation: float 8s infinite alternate ease-in-out; pointer-events: none;
        }
        @keyframes float { 0% { transform: translate(-30%, -30%) scale(1); } 100% { transform: translate(30%, 30%) scale(1.2); } }

        .top-controls { position: fixed; top: 20px; right: 20px; display: flex; gap: 12px; z-index: 100; }
        .icon-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-main); padding: 8px 14px; border-radius: 20px; cursor: pointer; backdrop-filter: blur(10px); font-size: 14px; font-weight: 600; }
        
        .card {
            background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--border);
            border-radius: 24px; padding: 40px; width: 100%; max-width: 440px; text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4); animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .brand-logo { font-size: 32px; font-weight: 900; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
        .input-group { text-align: start; margin-bottom: 18px; }
        label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 6px; font-weight: 600; }
        input { width: 100%; padding: 14px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text-main); outline: none; font-size: 15px; }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #6366f1, #a855f7); color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px var(--accent-glow); }

        .otp-box { display: flex; gap: 8px; justify-content: center; margin: 20px 0; }
        .otp-box input { width: 45px; height: 50px; text-align: center; font-size: 20px; font-weight: bold; color: var(--accent); }
        #status { margin-top: 15px; font-size: 14px; font-weight: 600; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script> (function() { emailjs.init("dfHcVtsHMU2GkEVfL"); })(); </script>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="top-controls">
        <button class="icon-btn" onclick="toggleLanguage()" id="lang-btn">English</button>
        <button class="icon-btn" onclick="toggleTheme()" id="theme-btn">☀️ / 🌙</button>
    </div>

    <div class="card">
        <div class="brand-logo">TRL CLOUD HUB</div>
        <p style="color: var(--text-sub); font-size: 14px; margin-bottom: 25px;" id="sub-title">إستضافة المشاريع والسيرفرات السحابية</p>

        <form id="auth-form">
            <div class="input-group">
                <label id="lbl-email">البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="developer@trl.com">
            </div>
            <div class="input-group">
                <label id="lbl-pass">كلمة السر</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn" id="btn-login">دخول / تسجيل حساب</button>
        </form>

        <div id="otp-section" style="display: none;">
            <h3 id="otp-title">أدخل رمز التحقق (OTP)</h3>
            <div class="otp-box" dir="ltr">
                <input type="text" maxlength="1" class="otp-digit">
                <input type="text" maxlength="1" class="otp-digit">
                <input type="text" maxlength="1" class="otp-digit">
                <input type="text" maxlength="1" class="otp-digit">
                <input type="text" maxlength="1" class="otp-digit">
                <input type="text" maxlength="1" class="otp-digit">
            </div>
            <button class="btn" onclick="verifyOTP()" id="btn-verify">تأكيد الدخول</button>
        </div>

        <div id="status"></div>
    </div>

    <script>
        let currentLang = 'ar';
        const RENDER_BACKEND_URL = "https://your-render-service.onrender.com"; // رابط سيرفر Render المستقبلي

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('lang-btn').textContent = currentLang === 'ar' ? 'English' : 'عربي';
            document.getElementById('sub-title').textContent = currentLang === 'ar' ? 'إستضافة المشاريع والسيرفرات السحابية' : 'Cloud Project Hosting & Repository Hub';
            document.getElementById('lbl-email').textContent = currentLang === 'ar' ? 'البريد الإلكتروني' : 'Email Address';
            document.getElementById('lbl-pass').textContent = currentLang === 'ar' ? 'كلمة السر' : 'Password';
            document.getElementById('btn-login').textContent = currentLang === 'ar' ? 'دخول / تسجيل حساب' : 'Login / Register';
        }

        const otpDigits = document.querySelectorAll('.otp-digit');
        otpDigits.forEach((input, index) => {
            input.addEventListener('input', () => {
                if(input.value && index < 5) otpDigits[index + 1].focus();
            });
        });

        document.getElementById('auth-form').addEventListener('submit', function(e) {
            e.preventDefault();
            sendOTP();
        });

        function sendOTP() {
            const email = document.getElementById('email').value;
            const otp = Math.floor(100000 + Math.random() * 900000).toString();
            
            document.getElementById('status').textContent = currentLang === 'ar' ? '⏳ جاري إرسال الرمز...' : '⏳ Sending OTP...';
            
            emailjs.send('service_jyuwmvb', 'template_128vuh7', {
                to_email: email,
                otp_code: otp
            }).then(() => {
                localStorage.setItem('temp_otp', otp);
                localStorage.setItem('user_email', email);
                document.getElementById('auth-form').style.display = 'none';
                document.getElementById('otp-section').style.display = 'block';
                document.getElementById('status').textContent = '';
            }).catch(() => {
                document.getElementById('status').textContent = '❌ Error sending email';
            });
        }

        function verifyOTP() {
            let enteredOTP = '';
            otpDigits.forEach(d => enteredOTP += d.value);
            if (enteredOTP === localStorage.getItem('temp_otp')) {
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('status').textContent = currentLang === 'ar' ? '❌ الرمز خاطئ' : '❌ Invalid OTP';
            }
        }
    </script>
</body>
</html>
