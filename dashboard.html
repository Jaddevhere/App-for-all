<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRL CLOUD HUB - Dashboard</title>
    <style>
        :root[data-theme="dark"] {
            --bg: #090d16;
            --sidebar: #111827;
            --card: #1f2937;
            --border: #374151;
            --text: #f9fafb;
            --text-sub: #9ca3af;
            --accent: #6366f1;
            --code-bg: #030712;
        }
        :root[data-theme="light"] {
            --bg: #f3f4f6;
            --sidebar: #ffffff;
            --card: #ffffff;
            --border: #e5e7eb;
            --text: #111827;
            --text-sub: #6b7280;
            --accent: #4f46e5;
            --code-bg: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; transition: all 0.25s ease; }
        body { background: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; }

        /* Sidebar Navigation */
        .sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); padding: 25px 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .logo { font-size: 22px; font-weight: 900; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-items { list-style: none; margin-top: 30px; }
        .nav-item { padding: 12px 16px; margin-bottom: 8px; border-radius: 12px; cursor: pointer; color: var(--text-sub); font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .nav-item.active, .nav-item:hover { background: var(--accent); color: white; }

        /* Main Content */
        .main { flex: 1; padding: 30px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .actions { display: flex; gap: 12px; align-items: center; }

        .btn { padding: 10px 18px; background: var(--accent); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }

        /* Project Cards */
        .search-bar { width: 100%; padding: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; color: var(--text); margin-bottom: 25px; }
        .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .project-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; position: relative; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; }
        .badge-public { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .badge-private { background: rgba(239, 68, 68, 0.15); color: #ef4444; }

        /* Code Editor & Runner Modal */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-body { background: var(--card); border: 1px solid var(--border); width: 90%; max-width: 800px; border-radius: 20px; padding: 25px; max-height: 90vh; overflow-y: auto; }
        textarea { width: 100%; height: 200px; background: var(--code-bg); color: #38bdf8; font-family: monospace; padding: 15px; border-radius: 10px; border: 1px solid var(--border); font-size: 14px; margin: 10px 0; }

        /* Social Media URLs Form */
        .social-input { display: flex; gap: 10px; margin-bottom: 10px; }
        .social-input input { flex: 1; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); }

        /* Notification Popup */
        .notif-menu { position: absolute; top: 70px; right: 30px; background: var(--card); border: 1px solid var(--border); width: 280px; border-radius: 12px; padding: 15px; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.3); z-index: 500; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div>
            <div class="logo">TRL CLOUD HUB</div>
            <ul class="nav-items">
                <li class="nav-item active" onclick="showSection('projects')">📁 Projects / المشاريع</li>
                <li class="nav-item" onclick="showSection('profile')">👤 Profile / الملف الشخصي</li>
                <li class="nav-item" onclick="showSection('settings')">⚙️ Settings / الإعدادات</li>
            </ul>
        </div>
        <button class="btn btn-outline" onclick="logout()" style="width:100%;">Logout / خروج</button>
    </aside>

    <main class="main">
        <header class="header">
            <h2 id="section-title">Projects Hub</h2>
            <div class="actions">
                <button class="btn-outline btn" onclick="toggleNotif()">🔔 Notification</button>
                <button class="btn-outline btn" onclick="toggleTheme()">☀️ / 🌙</button>
                <button class="btn-outline btn" onclick="toggleLang()" id="lang-btn">عربي</button>
                <button class="btn" onclick="openNewProjectModal()">+ New Project</button>
            </div>
        </header>

        <!-- Notification Menu -->
        <div class="notif-menu" id="notif-box">
            <h4 style="margin-bottom:10px;">Notifications</h4>
            <p style="font-size:12px; color:var(--text-sub);">🎉 Welcome to TRL CLOUD HUB!</p>
            <p style="font-size:12px; color:var(--text-sub); margin-top:5px;">🚀 Render Server Sync Active.</p>
        </div>

        <!-- Section 1: Projects Hub -->
        <div id="sec-projects">
            <input type="text" class="search-bar" placeholder="Search projects by name, language or extension (.py, .html)..." oninput="filterProjects(this.value)">
            <div class="project-grid" id="project-container"></div>
        </div>

        <!-- Section 2: Profile Settings & Links -->
        <div id="sec-profile" style="display: none;">
            <div class="project-card" style="max-width: 600px; margin: 0 auto;">
                <h3>User Profile</h3>
                <p style="color: var(--text-sub); font-size: 13px; margin-bottom: 20px;" id="user-email-display"></p>
                
                <h4 style="margin: 15px 0 10px 0;">Social Media Links / حساباتك</h4>
                <div class="social-input">
                    <input type="text" placeholder="Platform Name (e.g. YouTube)" id="link-name">
                    <input type="url" placeholder="URL (https://...)" id="link-url">
                </div>
                <button class="btn" onclick="addSocialLink()">+ Add Social Link</button>
                
                <div id="social-links-list" style="margin-top:20px;"></div>
            </div>
        </div>
    </main>

    <!-- Create Project Modal -->
    <div class="modal" id="project-modal">
        <div class="modal-body">
            <h3>Create / Edit Project</h3>
            <input type="text" id="p-title" class="search-bar" placeholder="Project Name (e.g. My Python Bot)" style="margin-top:10px;">
            
            <label style="font-size:12px; color:var(--text-sub);">Select Language (+20 Supported)</label>
            <select id="p-lang" class="search-bar" style="margin-top:5px;" onchange="updateExt()">
                <option value="html">HTML / Web (.html)</option>
                <option value="python">Python (.py)</option>
                <option value="javascript">JavaScript (.js)</option>
                <option value="cpp">C++ (.cpp)</option>
                <option value="java">Java (.java)</option>
                <option value="css">CSS (.css)</option>
                <option value="json">JSON (.json)</option>
                <option value="php">PHP (.php)</option>
                <option value="csharp">C# (.cs)</option>
                <option value="go">Go (.go)</option>
                <option value="rust">Rust (.rs)</option>
            </select>

            <label style="font-size:12px; color:var(--text-sub);">Visibility</label>
            <select id="p-access" class="search-bar" style="margin-top:5px;">
                <option value="public">Public (عام)</option>
                <option value="private">Private (خاص)</option>
            </select>

            <label style="font-size:12px; color:var(--text-sub);">Source Code</label>
            <textarea id="p-code" placeholder="// Write or paste your code here..."></textarea>

            <div style="display:flex; justify-content:space-between; margin-top:15px;">
                <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
                <button class="btn" onclick="saveProject()">Save & Host Project 🚀</button>
            </div>
        </div>
    </div>

    <!-- Live Preview Runner Modal -->
    <div class="modal" id="runner-modal">
        <div class="modal-body" style="width:95%; max-width:1000px; height:80vh;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h3 id="runner-title">Live Preview URL</h3>
                <button class="btn btn-outline" onclick="closeRunner()">Close ✖</button>
            </div>
            <iframe id="preview-frame" style="width:100%; height:85%; border:1px solid var(--border); border-radius:12px; background:white;"></iframe>
        </div>
    </div>

    <script>
        let projects = JSON.parse(localStorage.getItem('trl_projects') || '[]');
        let currentLang = 'en';

        if(localStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'index.html';
        document.getElementById('user-email-display').textContent = localStorage.getItem('user_email');

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        }

        function toggleLang() {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('lang-btn').textContent = currentLang === 'ar' ? 'English' : 'عربي';
        }

        function toggleNotif() {
            const box = document.getElementById('notif-box');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
        }

        function showSection(sec) {
            document.getElementById('sec-projects').style.display = sec === 'projects' ? 'block' : 'none';
            document.getElementById('sec-profile').style.display = sec === 'profile' ? 'block' : 'none';
        }

        function openNewProjectModal() { document.getElementById('project-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('project-modal').style.display = 'none'; }
        function closeRunner() { document.getElementById('runner-modal').style.display = 'none'; }

        function saveProject() {
            const title = document.getElementById('p-title').value;
            const lang = document.getElementById('p-lang').value;
            const access = document.getElementById('p-access').value;
            const code = document.getElementById('p-code').value;

            if(!title) return alert('Enter project title');

            const extMap = { html: '.html', python: '.py', javascript: '.js', cpp: '.cpp', java: '.java', css: '.css', json: '.json' };
            const newProj = { id: Date.now(), title, lang, ext: extMap[lang] || '.txt', access, code };

            projects.push(newProj);
            localStorage.setItem('trl_projects', JSON.stringify(projects));
            closeModal();
            renderProjects();
        }

        function renderProjects(filterText = '') {
            const container = document.getElementById('project-container');
            container.innerHTML = '';

            projects.filter(p => p.title.toLowerCase().includes(filterText.toLowerCase()) || p.ext.includes(filterText)).forEach(p => {
                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <span class="badge ${p.access === 'public' ? 'badge-public' : 'badge-private'}">${p.access}</span>
                    <h3>${p.title} <small style="color:var(--accent);">${p.ext}</small></h3>
                    <p style="font-size:12px; color:var(--text-sub); margin: 10px 0;">Lang: ${p.lang.toUpperCase()}</p>
                    <button class="btn" style="width:100%; margin-top:10px;" onclick="runLiveProject(${p.id})">🔗 Preview & Run URL</button>
                `;
                container.appendChild(card);
            });
        }

        function runLiveProject(id) {
            const p = projects.find(item => item.id === id);
            document.getElementById('runner-title').textContent = `Hosted at: https://trl-hub.cloud/view/${p.id}${p.ext}`;
            const frame = document.getElementById('preview-frame');
            
            if(p.lang === 'html') {
                frame.srcdoc = p.code;
            } else {
                frame.srcdoc = `<pre style="font-family:monospace; padding:20px; color:#333;">// Simulation Execution Output for ${p.ext}\n\n${p.code}</pre>`;
            }
            document.getElementById('runner-modal').style.display = 'flex';
        }

        function filterProjects(val) { renderProjects(val); }

        function logout() {
            localStorage.removeItem('isLoggedIn');
            window.location.href = 'index.html';
        }

        renderProjects();
    </script>
</body>
</html>
