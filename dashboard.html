<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | Dashboard</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #6366f1;
            --card-bg: #1e293b;
            --border-color: #334155;
            --gold: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.3s ease;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background-color: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px 20px;
        }

        .brand {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 35px;
        }

        .menu-list { list-style: none; }

        .menu-item {
            padding: 12px 16px;
            margin-bottom: 10px;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
        }

        .menu-item:hover, .menu-item.active {
            background-color: var(--accent);
            color: white;
        }

        .logout-btn {
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .logout-btn:hover { background-color: #ef4444; color: white; }

        .main-content {
            flex: 1;
            padding: 35px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 22px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .stat-card h4 { color: var(--text-sub); font-size: 13px; margin-bottom: 10px; }
        .stat-card .value { font-size: 26px; font-weight: bold; }

        .daily-card {
            background: linear-gradient(135deg, #1e1b4b 0%, #311042 100%);
            border: 1px solid rgba(168, 85, 247, 0.4);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .daily-btn {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }

        .daily-btn:disabled {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        (function() { emailjs.init("dfHcVtsHMU2GkEVfL"); })();

        // حماية الصفحة
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>
</head>
<body>

    <aside class="sidebar">
        <div>
            <div class="brand">⚡ AppForAll</div>
            <ul class="menu-list">
                <li class="menu-item active">📊 الرئيسية</li>
                <li class="menu-item">🎁 المكافآت اليومية</li>
                <li class="menu-item">⚙️ الإعدادات</li>
            </ul>
        </div>
        <button class="logout-btn" onclick="logout()">تسجيل الخروج 🚪</button>
    </aside>

    <main class="main-content">
        <header class="header">
            <div>
                <h1>منوّر الموقع! 👋 🎉</h1>
                <p style="color: var(--text-sub); font-size: 14px; margin-top: 5px;">مرحباً بك في لوحة التحكم الخاصة بك</p>
            </div>
        </header>

        <!-- قسم المكافأة اليومية -->
        <section class="daily-card">
            <h2>🎁 تسجيل الحضور اليومي</h2>
            <p style="color: var(--text-sub); margin-top: 8px;">سجل دخولك كل 24 ساعة واحصل على +50 نقطة مجانية!</p>
            <button id="claim-btn" class="daily-btn" onclick="claimDailyReward()">استلام المكافأة اليومية 🌟</button>
            <p id="claim-status" style="margin-top: 10px; font-weight: bold; font-size: 14px;"></p>
        </section>

        <!-- كروت الإحصائيات -->
        <section class="stats-grid">
            <div class="stat-card">
                <h4>رصيد النقاط</h4>
                <div class="value" id="points-display" style="color: var(--gold);">0 ⭐</div>
            </div>
            <div class="stat-card">
                <h4>حالة الحساب</h4>
                <div class="value" style="color: #4ade80;">مؤكد بـ OTP 🟢</div>
            </div>
            <div class="stat-card">
                <h4>البريد الإلكتروني</h4>
                <div class="value" id="user-email-display" style="font-size: 15px;">---</div>
            </div>
        </section>
    </main>

    <script>
        const userEmail = localStorage.getItem('user_email');
        if (userEmail) {
            document.getElementById('user-email-display').textContent = userEmail;
        }

        // إرسال إيميل الترحيب مرة واحدة عند الدخول الأول بعد التحقق
        if (localStorage.getItem('triggerWelcomeEmail') === 'true' && userEmail) {
            localStorage.removeItem('triggerWelcomeEmail');
            emailjs.send('service_jyuwmvb', 'template_qsgvasi', {
                to_email: userEmail
            });
        }

        // إدارة النقاط والمكافأة اليومية
        function loadPoints() {
            const points = localStorage.getItem('user_points') || 0;
            document.getElementById('points-display').textContent = `${points} ⭐`;
            checkDailyStatus();
        }

        function checkDailyStatus() {
            const lastClaim = localStorage.getItem('last_claim_time');
            const claimBtn = document.getElementById('claim-btn');
            const claimStatus = document.getElementById('claim-status');

            if (lastClaim) {
                const hoursPassed = (Date.now() - parseInt(lastClaim)) / (1000 * 60 * 60);
                if (hoursPassed < 24) {
                    claimBtn.disabled = true;
                    claimBtn.textContent = 'تم استلام المكافأة اليوم';
                    claimStatus.style.color = '#94a3b8';
                    claimStatus.textContent = 'عد غداً للحصول على 50 نقطة جديدة!';
                    return;
                }
            }
            claimBtn.disabled = false;
            claimBtn.textContent = 'استلام المكافأة اليومية (+50) 🌟';
        }

        function claimDailyReward() {
            let currentPoints = parseInt(localStorage.getItem('user_points') || 0);
            currentPoints += 50;

            localStorage.setItem('user_points', currentPoints);
            localStorage.setItem('last_claim_time', Date.now());

            document.getElementById('claim-status').style.color = '#4ade80';
            document.getElementById('claim-status').textContent = '🎉 مبروك! حصلت على 50 نقطة جديدة!';

            loadPoints();
        }

        function logout() {
            localStorage.removeItem('isLoggedIn');
            window.location.href = 'index.html';
        }

        // تحميل النقاط عند الفتح
        loadPoints();
    </script>

</body>
</html>
