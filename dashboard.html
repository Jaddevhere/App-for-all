<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | Dashboard</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #6366f1;
            --card-bg: #1e293b;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background-color: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .brand {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .menu-list { list-style: none; }

        .menu-item {
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }

        .menu-item:hover, .menu-item.active {
            background-color: var(--accent);
            color: white;
        }

        .logout-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .logout-btn:hover { background-color: #dc2626; }

        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .stat-card h4 { color: var(--text-sub); font-size: 14px; margin-bottom: 8px; }
        .stat-card .value { font-size: 24px; font-weight: bold; }

        .content-card {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; }
        }
    </style>
    <script>
        // حماية الصفحة من الوصول المباشر
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>
</head>
<body>

    <aside class="sidebar">
        <div>
            <div class="brand">⚡ AppForAll</div>
            <ul class="menu-list">
                <li class="menu-item active">📊 الرئيسية</li>
                <li class="menu-item">👤 الملف الشخصي</li>
                <li class="menu-item">⚙️ الإعدادات</li>
            </ul>
        </div>
        <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
    </aside>

    <main class="main-content">
        <header class="header">
            <div>
                <h1>منوّر الموقع! 👋 🎉</h1>
                <p style="color: var(--text-sub); font-size: 14px;">تم التأكد من رمز التحقق ودخولك بنجاح</p>
            </div>
        </header>

        <section class="stats-grid">
            <div class="stat-card">
                <h4>حالة الحساب</h4>
                <div class="value" style="color: #10b981;">مؤكد ونشط 🟢</div>
            </div>
            <div class="stat-card">
                <h4>البريد الإلكتروني</h4>
                <div class="value" id="user-email-display" style="font-size: 15px;">---</div>
            </div>
            <div class="stat-card">
                <h4>نوع الاشتراك</h4>
                <div class="value" style="color: var(--accent);">مجاني مدى الحياة</div>
            </div>
        </section>

        <section class="content-card">
            <h3>🚀 مرحباً بك في حسابك الشخصي</h3>
            <p style="color: var(--text-sub); margin-top: 10px; line-height: 1.6;">
                تم التحقق من الرمز بنجاح وفتح لوحة التحكم.
            </p>
        </section>
    </main>

    <script>
        const userEmail = localStorage.getItem('user_email');
        if (userEmail) {
            document.getElementById('user-email-display').textContent = userEmail;
        }

        function logout() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('user_email');
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>
